# Runs CipherVault against a real MS SQL Server.
#   docker compose up -d mssql
#   docker compose run --rm app init
#   docker compose run --rm app add github
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-CipherVault#2026}
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mssql: { condition: service_healthy }
    environment:
      CIPHERVAULT_USER: ${USER:-anish}
      CIPHERVAULT_DB: "mssql://DRIVER={ODBC Driver 18 for SQL Server};SERVER=mssql,1433;DATABASE=master;UID=sa;PWD=${MSSQL_SA_PASSWORD:-CipherVault#2026};TrustServerCertificate=yes"
    stdin_open: true
    tty: true
