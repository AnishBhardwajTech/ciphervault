name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=ciphervault --cov-report=term-missing

  test-mssql:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CipherVault#2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CipherVault#2026' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-retries 15
    env:
      CIPHERVAULT_TEST_MSSQL: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=master;UID=sa;PWD=CipherVault#2026;TrustServerCertificate=yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # GitHub's Ubuntu runners ship with Microsoft ODBC Driver 18 preinstalled.
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [test-sqlite]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ciphervault .
      - run: docker run --rm ciphervault generate -n 24
